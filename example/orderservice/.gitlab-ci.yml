stages:
  - generate
  - typecheck
  - test

.python-defaults:
  image: python:3.14-slim
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pip/
  before_script:
    - export PIP_CACHE_DIR="$CI_PROJECT_DIR/.cache/pip"
    - python -m pip install -e .
    - python -m pip install -e example/model
    - python -m pip install -e example/order_service_api
    - python -m pip install -e example/inventory_service_api
    - python -m pip install -e example/orderservice
    - python -m pip install -r example/requirements-dev.txt

generate:
  extends: .python-defaults
  stage: generate
  script:
    - ./example/run.sh generate
    - git diff --exit-code -- example/order_service_api example/inventory_service_api

typecheck:
  extends: .python-defaults
  stage: typecheck
  script:
    - ./example/run.sh typecheck

test:
  extends: .python-defaults
  stage: test
  script:
    - python -m pytest example/orderservice/tests -q
