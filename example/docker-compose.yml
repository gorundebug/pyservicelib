services:
  inventoryservice:
    build:
      context: ..
      dockerfile: example/Dockerfile
    command:
      - python
      - -m
      - inventoryservice.main
      - --config
      - /workspace/example/inventoryservice/config/config.yaml
    ports:
      - "9092:9092"
      - "9202:9202"

  orderservice:
    build:
      context: ..
      dockerfile: example/Dockerfile
    command:
      - python
      - -m
      - orderservice.main
      - --config
      - /workspace/example/orderservice/config/config.yaml
    environment:
      INVENTORY_SERVICE_API_ADDRESS: inventoryservice:9202
    ports:
      - "9091:9091"
    depends_on:
      - inventoryservice

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles:
      - observability
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - inventoryservice
      - orderservice

  grafana:
    image: grafana/grafana:12.3.1
    profiles:
      - observability
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./inventoryservice/grafana/dist:/etc/grafana/dashboards/inventoryservice:ro
      - ./orderservice/grafana/dist:/etc/grafana/dashboards/orderservice:ro
    depends_on:
      - prometheus

volumes:
  grafana_data:
