global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: inventoryservice
    metrics_path: /metrics
    static_configs:
      - targets:
          - inventoryservice:9092

  - job_name: orderservice
    metrics_path: /metrics
    static_configs:
      - targets:
          - orderservice:9091
