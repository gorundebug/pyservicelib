[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "servicelib-example-inventory-service-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["grpcio>=1.65.0", "protobuf>=6.31.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_service_api"]
