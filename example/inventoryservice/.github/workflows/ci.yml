name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            example/requirements-dev.txt

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -e example/model
          python -m pip install -e example/inventory_service_api
          python -m pip install -e example/inventoryservice
          python -m pip install -r example/requirements-dev.txt

      - name: Verify generated transport code
        run: |
          ./example/run.sh generate
          git diff --exit-code -- example/order_service_api example/inventory_service_api

      - name: Type-check
        run: ./example/run.sh typecheck

      - name: Test inventory service
        run: python -m pytest example/inventoryservice/tests -q
