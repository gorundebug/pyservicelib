[mypy]
python_version = 3.14
strict = True
implicit_reexport = True
ignore_missing_imports = True
warn_unreachable = True
show_error_codes = True
pretty = True
exclude = (^|/)generated/

# grpcio-tools currently emits a base servicer without type information.
# Keep every other strict check enabled for the generated adapter.
[mypy-inventoryservice.internal.app.grpc_service_generated]
disallow_subclassing_any = False
disallow_untyped_calls = False

# grpcio-tools does not emit typing information for generated client stubs.
[mypy-orderservice.internal.app.service_generated]
disallow_untyped_calls = False
